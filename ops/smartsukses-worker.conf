; Supervisor — worker antrean Smart Sukses School
;
; Salin ke /etc/supervisor/conf.d/smartsukses-worker.conf, sesuaikan path dan
; user, lalu:
;
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status smartsukses-worker:*
;
; Pekerjaan yang diantrekan: generate PDF rapor sekelas dan penerbitan tagihan
; massal (Tech stack 3.1, Deployment 3.3). Tanpa worker keduanya menggantung
; tanpa pesan galat apa pun.

[program:smartsukses-worker]
process_name=%(program_name)s_%(process_num)02d

; --tries dan --backoff sengaja TIDAK disebut di sini: keduanya sudah menjadi
; properti job (tries=3, backoff=10), dan menyebutnya lagi di baris perintah
; menciptakan dua sumber kebenaran yang dapat berbeda.
;
; --timeout=60 WAJIB lebih kecil daripada `retry_after` antrean database, yang
; bawaannya 90 detik. Bila timeout melampauinya, job yang masih berjalan akan
; diantrekan ulang dan dikerjakan dua kali — yang pada penerbitan tagihan
; massal berarti tagihan ganda (butir 368).
;
; Bila kelak ada job yang benar-benar butuh lebih dari 60 detik, naikkan
; DB_QUEUE_RETRY_AFTER lebih dulu, baru --timeout, dan jaga urutannya tetap
; timeout < retry_after.
command=php /var/www/smartsukses/artisan queue:work database --queue=default --sleep=3 --timeout=60 --max-time=3600

directory=/var/www/smartsukses
autostart=true
autorestart=true

; Worker Laravel berhenti sendiri secara berkala (--max-time) supaya memori
; tidak menumpuk; keluar dengan kode 0 itu normal dan bukan kegagalan.
stopasgroup=true
killasgroup=true

; SIGTERM memberi worker kesempatan menyelesaikan job yang sedang berjalan.
stopsignal=TERM
; Lebih panjang daripada --timeout, supaya job terakhir sempat selesai.
stopwaitsecs=90

user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/smartsukses/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
