; Penyetelan PHP Smart Sukses School (SAPI FPM).
;
; Pasang:
;   sudo cp ops/php-smartsukses.ini /etc/php/8.3/fpm/conf.d/99-smartsukses.ini
;   sudo systemctl reload php8.3-fpm
;
; Awalan 99- disengaja: berkas di conf.d dibaca berurutan, dan nilai di sini
; harus menang atas paket bawaan.
;
; Periksa hasilnya dari SAPI yang benar — `php -i` membaca konfigurasi CLI dan
; bukan FPM:
;   php -r 'echo ini_get("post_max_size");'            # CLI, BUKAN yang dipakai web
;   curl -s https://apps.smartsukses.sch.id/ -o /dev/null   # lalu periksa phpinfo terbatas
;   sudo -u www-data php-fpm8.3 -tt 2>&1 | head        # memastikan pool terbaca

; ------------------------------------------------------------------ unggahan
;
; Angka-angka ini diturunkan dari batas yang sudah berlaku di aplikasi, bukan
; dikarang:
;
;   - berkas tunggal terbesar  : 5 MB  — impor Excel siswa dan nilai
;                                (ListStudents.php:90, ListGrades.php:81 = 5120 KB)
;   - satu permintaan terbesar : 10 MB — PPDB menerima 5 dokumen × 2 MB
;                                (Livewire/Ppdb/RegistrationForm.php:92-94)
;   - foto siswa               : 2 MB  (CON-43)
;   - bukti pembayaran         : 5 MB  (CON-44)
;
; Bawaan PHP adalah post_max_size=8M, yang MEMOTONG pendaftaran PPDB berisi 5
; dokumen tanpa galat yang dapat dibaca pendaftar. Nilai di sini harus selalu
; <= client_max_body_size di ops/nginx-smartsukses.conf (12m).
upload_max_filesize = 5M
post_max_size = 12M
max_file_uploads = 20

; ------------------------------------------------------------------ eksekusi
;
; Ekspor Excel dan impor adalah permintaan web terlama yang normal. Pembuatan PDF
; rapor TIDAK termasuk di sini: ia berjalan di antrean (CLI), yang tidak dibatasi
; max_execution_time. Nilai ini harus <= fastcgi_read_timeout Nginx (120s), agar
; yang memutus lebih dulu adalah PHP — dengan galat yang tercatat — dan bukan
; Nginx dengan 504 yang tak berjejak.
max_execution_time = 90
max_input_time = 90

; PhpSpreadsheet memuat lembar kerja ke memori. 5 MB xlsx dapat mengembang
; berkali-kali lipat saat dibaca, dan 128M bawaan tidak cukup untuk impor
; sekelas penuh. Tetap jauh di bawah anggaran RAM per proses pada VPS 2 GB
; (CON-21) — lihat perhitungan di ops/php-fpm-smartsukses.conf.
memory_limit = 256M

; ------------------------------------------------------------------ keamanan
;
; Versi PHP tidak diumumkan lewat header. Bukan pengaman sesungguhnya, tetapi
; tidak ada alasan memberitahukannya.
expose_php = Off

; Galat dicatat, tidak pernah ditampilkan. APP_DEBUG=false mengurus sisi Laravel;
; baris ini mengurus galat yang terjadi sebelum Laravel hidup (mis. kegagalan
; memuat ekstensi), yang jika tidak justru tampil di browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php8.3-fpm-smartsukses-error.log

; ------------------------------------------------------------------- opcache
;
; validate_timestamps=0 membuat opcache TIDAK memeriksa perubahan berkas —
; lebih cepat, tetapi berarti setiap rilis WAJIB diikuti reload:
;   sudo systemctl reload php8.3-fpm
; Bila langkah itu tidak ada di prosedur rilis, biarkan validate_timestamps=1.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Zona waktu PHP. Ini TIDAK mengubah zona waktu cron — lihat catatan di
; ops/smartsukses-cron.
date.timezone = Asia/Jakarta
