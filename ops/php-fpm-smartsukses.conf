; Pool PHP-FPM Smart Sukses School.
;
; Pasang:
;   sudo cp ops/php-fpm-smartsukses.conf /etc/php/8.3/fpm/pool.d/smartsukses.conf
;   sudo rm -f /etc/php/8.3/fpm/pool.d/www.conf     # pool bawaan, socket berbeda
;   sudo php-fpm8.3 -t && sudo systemctl restart php8.3-fpm
;
; Nama socket di sini harus sama dengan fastcgi_pass di
; ops/nginx-smartsukses.conf. Bila pool bawaan `www` dibiarkan hidup, ia tetap
; memakan RAM untuk tidak melayani apa pun.

[smartsukses]

user = www-data
group = www-data

listen = /run/php/php8.3-fpm-smartsukses.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ----------------------------------------------------------- jumlah proses
;
; CON-21 menetapkan VPS 2 Core / 2 GB RAM, dan pada satu kotak itulah Nginx,
; PHP-FPM, MySQL, dan queue worker hidup bersama (CON-20). `pm.max_children`
; karena itu bukan soal selera melainkan soal anggaran RAM:
;
;   total                                        2048 MB
;   - sistem operasi + sshd + cron                 250 MB
;   - MySQL (innodb_buffer_pool 512M + overhead)   750 MB
;   - Nginx                                         50 MB
;   - queue worker (php CLI, 1 proses)             150 MB
;   - cadangan agar tidak pernah menyentuh swap    250 MB
;   ------------------------------------------------------
;   sisa untuk PHP-FPM                             598 MB
;
; Satu permintaan Filament/Livewire menghabiskan ~55-60 MB. 598 / 60 ~= 9.
; Diambil 8, bukan 9, karena melewati batas berarti OOM killer — dan yang
; biasanya dibunuhnya adalah MySQL, bukan PHP.
;
; UKUR SEBELUM MENAIKKAN. Pemakaian nyata per proses:
;   ps -o rss= -C php-fpm8.3 | awk '{s+=$1} END {print s/NR/1024 " MB rata-rata"}'
;
; `pm = dynamic` dan bukan `ondemand`: panel admin dipakai sepanjang jam kerja,
; dan menyalakan proses dari nol pada setiap permintaan pertama terasa lambat
; justru saat orang mulai bekerja.
pm = dynamic
pm.max_children = 8
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Mendaur ulang proses menutup kebocoran memori yang menumpuk pada proses yang
; hidup berhari-hari. 500 cukup jarang untuk tidak menjadi beban.
pm.max_requests = 500

; Antrean listen. Permintaan di atas max_children menunggu di sini alih-alih
; ditolak; 511 mengikuti somaxconn bawaan Linux.
listen.backlog = 511

; ------------------------------------------------------------------ diagnosa
;
; Tanpa ini, "situs lambat" tidak dapat ditelusuri ke permintaan mana pun.
; Ambangnya di bawah max_execution_time (90s) supaya yang lambat tercatat
; sebelum ia mati.
slowlog = /var/log/php8.3-fpm-smartsukses-slow.log
request_slowlog_timeout = 15s

; Batas atas keras per permintaan. Nilainya harus >= max_execution_time di
; ops/php-smartsukses.ini, jika tidak permintaan dibunuh tanpa galat PHP.
request_terminate_timeout = 120s

pm.status_path = /fpm-status
ping.path = /fpm-ping

; Log FPM tidak mewarisi error_log dari php.ini.
php_admin_value[error_log] = /var/log/php8.3-fpm-smartsukses-error.log
php_admin_flag[log_errors] = on

; ------------------------------------------------------------------- lingkungan
;
; FPM TIDAK meneruskan variabel lingkungan sistem secara bawaan. Aplikasi ini
; membaca konfigurasinya dari berkas .env Laravel, jadi baris di bawah hanya
; memastikan PATH tersedia untuk proses anak (mis. pemanggilan biner eksternal).
env[PATH] = /usr/local/bin:/usr/bin:/bin
