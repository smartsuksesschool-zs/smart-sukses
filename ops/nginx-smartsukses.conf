# Server block Nginx Smart Sukses School.
#
# Pasang:
#   sudo cp ops/nginx-smartsukses.conf /etc/nginx/sites-available/smartsukses
#   sudo ln -s /etc/nginx/sites-available/smartsukses /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # hapus situs bawaan
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: jalankan `sudo certbot --nginx -d apps.smartsukses.sch.id` SESUDAH blok ini
# aktif. Certbot menyisipkan sendiri baris ssl_certificate dan blok pengalihan
# port 80 — jangan menulisnya tangan lebih dulu, karena certbot perlu port 80
# terbuka untuk verifikasi HTTP-01.
#
# Rantai Internet → Cloudflare → Nginx → PHP-FPM beserta pemulihan alamat klien
# dijelaskan di docs/deployment-production.md §4, dan berada di berkas terpisah
# (/etc/nginx/conf.d/cloudflare-realip.conf). Blok ini tidak mengulangnya.

server {
    listen 80;
    listen [::]:80;
    server_name apps.smartsukses.sch.id;

    # CON-31: hanya `public/` yang berada di dalam web root. `storage/app` tidak
    # pernah dapat dijangkau lewat URL — berkas privat disajikan oleh controller
    # aplikasi yang memeriksa wewenang lebih dulu.
    root /var/www/smartsukses/public;
    index index.php;

    charset utf-8;

    # ------------------------------------------------------------------ batas
    #
    # BUKAN angka karangan. Satu pendaftaran PPDB yang sah dapat memuat 5 berkas
    # × 2 MB (app/Livewire/Ppdb/RegistrationForm.php:92-94) = 10 MB dalam SATU
    # permintaan. Bawaan Nginx adalah 1 MB, sehingga tanpa baris ini pendaftar
    # menerima 413 dan tidak ada satu pun galat yang tercatat di sisi aplikasi.
    #
    # Nilainya harus >= post_max_size di ops/php-smartsukses.ini, dan keduanya
    # harus naik bersama bila batas unggahan aplikasi diubah.
    client_max_body_size 12m;
    client_body_timeout 60s;

    # ------------------------------------------------------- header keamanan
    #
    # Sengaja di Nginx dan bukan di middleware aplikasi: ini batas yang tepat
    # untuk kebijakan seluruh situs (docs/deployment-production.md §5).
    # HSTS ditambahkan certbot-lah yang mengaktifkan HTTPS-nya; baris di sini
    # tetap aman pada port 80 karena browser mengabaikan HSTS di luar HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # CSP sengaja TIDAK disetel di sini. Filament dan Livewire memuat skrip dan
    # gaya sebaris; CSP yang ketat mematahkan panel admin tanpa peringatan yang
    # dapat dibaca. Bila CSP diinginkan, ia harus diuji lebih dulu di staging.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Aset ber-hash dari Vite. `immutable` aman karena namanya berubah setiap
    # build; berkas tanpa hash tidak masuk pola ini.
    location ~* ^/build/.*\.(css|js|woff2?|ttf|svg|png|jpe?g|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-smartsukses.sock;

        # Ekspor rapor dan impor Excel adalah permintaan terlama yang normal.
        # Harus >= max_execution_time PHP, jika tidak Nginx memutus lebih dulu
        # dan yang terlihat adalah 504 tanpa jejak di log aplikasi.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Berkas titik tidak pernah disajikan — termasuk `.env`, `.git`, dan berkas
    # cadangan editor. Pengecualian untuk /.well-known agar certbot tetap dapat
    # memperbarui sertifikat.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/smartsukses-access.log;
    error_log  /var/log/nginx/smartsukses-error.log warn;
}
